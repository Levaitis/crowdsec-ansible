- name: Verify (dind)
  hosts: all
  become: true
  tasks:
    - name: Ensure docker exists
      ansible.builtin.command: which docker
      register: docker_cmd
      changed_when: false

    - name: Assert docker exists
      ansible.builtin.assert:
        that:
          - docker_cmd.rc == 0

    - name: Wait for crowdsec API
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        method: GET
        status_code: 200
        timeout: 5
      register: api
      retries: 10
      delay: 3
      until: api.status == 200

    - name: Assert API responsive
      ansible.builtin.assert:
        that:
          - api.status == 200
