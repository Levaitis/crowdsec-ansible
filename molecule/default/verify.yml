- name: Verify (default)
  hosts: all
  become: true
  tasks:
    - name: Assert config exists
      ansible.builtin.stat:
        path: /etc/crowdsec/config.yaml
      register: cfg

    - name: Assert config exists
      ansible.builtin.assert:
        that:
          - cfg.stat.exists

    - name: Assert compose exists
      ansible.builtin.stat:
        path: /srv/crowdsec/docker-compose.yml
      register: dc

    - name: Assert compose exists
      ansible.builtin.assert:
        that:
          - dc.stat.exists
