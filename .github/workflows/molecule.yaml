name: Molecule CI

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  test:
    name: Molecule tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ansible-version: ["ansible"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev libffi-dev python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.ansible-version }}" \
            ansible-lint "molecule[docker]" docker
          python -m pip install \
            flake8 flake8-bugbear flake8-docstrings \
            flake8-import-order flake8-pylint \
            pytest pytest-testinfra yamllint
          if [ -f requirements.yml ]; then
            ansible-galaxy collection install -r requirements.yml;
          fi
        env:
          PIP_NO_WARN_SCRIPT_LOCATION: 0

      - name: Lint with yamllint
        run: |
          yamllint . --format github

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          # The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 \
            --max-line-length=127 --statistics

      - name: Test with Molecule
        run: |
          molecule test --all
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
