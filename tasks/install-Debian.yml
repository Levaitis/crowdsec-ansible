---
# Installation tasks for Debian/Ubuntu

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg
      - curl
    state: present
    update_cache: true
  tags:
    - crowdsec
    - crowdsec-install

- name: Download CrowdSec GPG key
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /usr/share/keyrings/crowdsec-archive-keyring.gpg
    mode: '0644'
  tags:
    - crowdsec
    - crowdsec-install

- name: Add CrowdSec repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/crowdsec-archive-keyring.gpg]
      https://packagecloud.io/crowdsec/crowdsec/{{ ansible_distribution | lower }}/
      {{ ansible_distribution_release }} main
    state: present
    filename: crowdsec
  tags:
    - crowdsec
    - crowdsec-install

- name: Install CrowdSec package
  ansible.builtin.apt:
    name: "crowdsec{{ '=' + crowdsec_version if crowdsec_version else '' }}"
    state: "{{ crowdsec_package_state }}"
    update_cache: true
  notify: Restart crowdsec
  tags:
    - crowdsec
    - crowdsec-install
